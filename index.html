  <style>
    :root {
      --bg: #080d25;
      --bg-2: #0e1537;
      --text: #e7ebff;
      --muted: #b6bedf;
      --card: rgba(19, 27, 63, 0.62);
      --line: rgba(136, 154, 214, 0.28);
      --accent: #24d4ff;
      --accent-2: #8f4cff;
      --accent-3: #ff31b9;
      --gold: #f3c969;
      --ok: #46d77a;
      --danger: #ff5f7d;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --font-ar: 'Cairo', sans-serif;
      --font-en: 'Inter', sans-serif;
    }
    [data-accent='blue']{--accent:#24d4ff;--accent-2:#8f4cff;--accent-3:#ff31b9;}
    [data-accent='purple']{--accent:#b77bff;--accent-2:#6d4bff;--accent-3:#24d4ff;}
    [data-accent='gold']{--accent:#f3c969;--accent-2:#ff9d00;--accent-3:#ff31b9;}

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at 10% 10%, rgba(143,76,255,.22), transparent 40%), radial-gradient(circle at 90% 20%, rgba(36,212,255,.16), transparent 35%), linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: var(--font-ar);
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .06;
      background-image: radial-gradient(#ffffff 0.7px, transparent 0.7px);
      background-size: 3px 3px;
      z-index: -1;
    }
    body[data-lang='en'] { font-family: var(--font-en); }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { width: min(1180px, 92%); margin: auto; }
    .section { padding: 90px 0; }
    .grid { display: grid; gap: 1rem; }
    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: .78rem 1.25rem;
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      transition: .25s;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }
    .btn.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .btn.secondary { background: rgba(255,255,255,.1); border-color: var(--line); }
    .btn:hover { transform: translateY(-2px); }
    .chip { padding: .4rem .8rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.05); cursor:pointer; }
    .chip.active { background: linear-gradient(120deg, rgba(36,212,255,.2), rgba(143,76,255,.25)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

    .glass {
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .topnav {
      position: sticky;
      top: 0;
      z-index: 90;
      transition: .3s;
      padding: .8rem 0;
      background: transparent;
      border-bottom: 1px solid transparent;
    }
    .topnav.scrolled { background: rgba(7,11,30,.9); border-color: var(--line); backdrop-filter: blur(8px); }
    .nav-inner { display:flex; justify-content:space-between; align-items:center; gap: 1rem; }
    .brand { font-weight: 800; font-size: 1.1rem; letter-spacing:.2px; }
    .nav-links { display:flex; gap:.85rem; flex-wrap:wrap; align-items:center; }
    .nav-links a { font-size:.92rem; color:var(--muted); }
    .nav-ctas { display:flex; gap:.6rem; align-items:center; flex-wrap: wrap; }
    .lang-toggle { min-width: 52px; text-align:center; }

    .hero { min-height: 92vh; display:grid; place-items:center; position:relative; }
    .hero-grid { display:grid; grid-template-columns: 1.15fr .85fr; gap: 1.2rem; align-items:center; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.7rem); line-height:1.15; margin:.1rem 0 1rem; }
    .hero p { color: var(--muted); max-width: 60ch; }
    .hero-card { padding: 1.2rem; }
    .avatar {
      width: min(420px, 92%);
      margin-inline: auto;
      aspect-ratio: 4/5;
      border-radius: 26px;
      background: linear-gradient(150deg, rgba(36,212,255,.32), rgba(143,76,255,.36), rgba(255,49,185,.24));
      padding: 12px;
      position: relative;
      animation: float 6s ease-in-out infinite;
    }
    .avatar .inner {
      height:100%; border-radius: 20px;
      background: linear-gradient(165deg, #17224f, #111936);
      display:grid; place-items:center;
      border:1px solid var(--line);
      text-align:center;
      padding:1rem;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .stats { grid-template-columns: repeat(3, 1fr); margin-top: 1rem; }
    .stat { padding: .85rem; text-align:center; }
    .stat b { font-size: 1.4rem; color: var(--gold); display:block; }

    .title { font-size: clamp(1.5rem, 2.5vw, 2.2rem); margin:0 0 .55rem; }
    .subtitle { color: var(--muted); max-width: 70ch; margin-bottom:1.3rem; }

    .about-grid { grid-template-columns: 1fr 1fr; }
    .about-card { padding: 1rem; }
    .list { margin:0; padding-inline-start: 1.1rem; }

    .filters { display:flex; gap:.6rem; flex-wrap:wrap; margin: .9rem 0 1rem; }
    .services-grid { grid-template-columns: repeat(3,1fr); }
    .card { padding: 1rem; border-radius: var(--radius); border:1px solid var(--line); background: rgba(255,255,255,.02); }
    .icon {
      width:40px; height:40px; border-radius: 12px; display:grid; place-items:center;
      background: linear-gradient(135deg, rgba(36,212,255,.2), rgba(143,76,255,.25)); margin-bottom:.6rem;
    }

    .courses-grid { grid-template-columns: repeat(3,1fr); }
    .course-cover { aspect-ratio:16/10; border-radius: 12px; background: linear-gradient(140deg, #1e2f7a, #6216a8); margin-bottom:.65rem; }
    .badge { font-size:.75rem; padding:.22rem .6rem; border:1px solid var(--line); border-radius: 999px; color:var(--muted); }

    .search-row { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom: 1rem; }
    .input, select, textarea {
      width:100%; background: rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text);
      border-radius: 12px; padding: .65rem .8rem; font: inherit;
    }

    .posts-grid { grid-template-columns: repeat(3,1fr); }
    .testimonial-wrap { position:relative; overflow:hidden; }
    .testimonial-track { display:flex; transition: transform .35s ease; }
    .testimonial { min-width: 100%; padding: 1rem; }

    .faq-item + .faq-item { margin-top: .6rem; }
    .faq-q { width:100%; text-align:start; background: rgba(255,255,255,.03); color:var(--text); border:1px solid var(--line); border-radius: 12px; padding:.8rem; cursor:pointer; }
    .faq-a { max-height: 0; overflow: hidden; transition:max-height .3s ease; color:var(--muted); padding:0 .7rem; }

    .contact-grid { grid-template-columns: 1fr 1fr; }

    footer { border-top:1px solid var(--line); padding: 2rem 0; color: var(--muted); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(2,4,14,.7);
      display:none;
      place-items:center;
      z-index: 120;
      padding:1rem;
    }
    .modal.open { display:grid; }
    .modal-card {
      width:min(980px, 96vw);
      max-height: 92vh;
      overflow:auto;
      border-radius: 18px;
      border:1px solid var(--line);
      background: #0b1335;
      padding:1rem;
    }
    .close-btn { float:inline-end; background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }

    .admin-panel { margin-top: 1rem; padding: .9rem; }
    .admin-panel details { border:1px solid var(--line); border-radius: 12px; padding:.8rem; }
    .lesson-item { padding:.55rem; border:1px solid var(--line); border-radius:10px; margin-bottom:.4rem; background:rgba(255,255,255,.04); cursor:grab; }

    .seg { display:flex; gap:.5rem; margin: .65rem 0; flex-wrap: wrap; }
    .seg button { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); padding:.45rem .7rem; border-radius:999px; cursor:pointer; }
    .seg button.active { background: linear-gradient(120deg, rgba(36,212,255,.2), rgba(143,76,255,.3)); }

    .reveal { opacity:0; transform: translateY(18px); transition: opacity .65s ease, transform .65s ease; }
    .reveal.show { opacity:1; transform:none; }

    @media (max-width: 980px){
      .hero-grid,.about-grid,.contact-grid { grid-template-columns: 1fr; }
      .services-grid,.courses-grid,.posts-grid { grid-template-columns: repeat(2,1fr); }
      .nav-links { display:none; }
    }
    @media (max-width: 680px){
      .services-grid,.courses-grid,.posts-grid,.stats { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none !important;transition:none !important}
    }
  </style>
</head>

function renderCourses(){
  const q = document.getElementById('courseSearch').value.toLowerCase();
  const langFilter = document.getElementById('courseLanguageFilter').value;
  const t = i18n[currentLang];
  const filtered = courses.filter(c=>{
    const title = (currentLang==='ar'?c.titleAr:c.titleEn).toLowerCase();
    return title.includes(q) && (langFilter==='all' || c.language===langFilter);
  });
  courseGrid.innerHTML = filtered.map(c=>`
    <article class="card glass">
      <div class="course-cover" style="background-image:${c.cover?`url('${c.cover}')`:'linear-gradient(135deg,#1f2f79,#7f24d8)'};background-size:cover;background-position:center;"></div>

  `).join('') || `<p>${t.enrollContact}</p>`;
}

}

  if(c.payment.stripePaymentLink) paymentTabs.push(['stripe', t.paymentTabs.stripe]);
  if(c.payment.paypalCheckoutLink) paymentTabs.push(['paypal', t.paymentTabs.paypal]);
  if((c.payment.instapayEnabled ?? true) && siteData.payments.instapay.enabled) paymentTabs.push(['instapay', t.paymentTabs.instapay]);
  const hasBuy = paymentTabs.length>0;
  document.getElementById('courseModalContent').innerHTML = `
    <h2>${currentLang==='ar'?c.titleAr:c.titleEn}</h2>
    <p style="color:var(--muted)">${currentLang==='ar'?c.descriptionAr:c.descriptionEn}</p>
    <p><b>${currentLang==='ar'?c.payment.priceDisplayAr:c.payment.priceDisplayEn}</b></p>
    <p>${currentLang==='ar'?'المدرب':'Instructor'}: ${currentLang==='ar'?c.instructorAr:c.instructorEn}</p>
    <h3>${currentLang==='ar'?'المحتوى':'Syllabus'}</h3>
    ${c.lessons.map((l,i)=>`<div class="lesson-item"><b>${i+1}. ${currentLang==='ar'?l.titleAr:l.titleEn}</b><div style="font-size:.9rem;color:var(--muted)">${l.type}</div></div>`).join('')}

    <h3>${i18n[currentLang].faq}</h3>

    <hr style="border-color:var(--line)">
    <div id="lessonPlayer"></div>
  `;
  if(paymentTabs.length) selectPayTab(id,paymentTabs[0][0]);

}
function renderLessonPlayer(course, idx){
  const lesson = course.lessons[idx]; if(!lesson) return;
  const t = i18n[currentLang];
  let content = `<h3>${t.continue}</h3><h4>${currentLang==='ar'?lesson.titleAr:lesson.titleEn}</h4>`;
  if(lesson.type==='video' && lesson.videoUrl) content += `<div style="position:relative;padding-top:56.25%"><iframe src="${lesson.videoUrl}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px" allowfullscreen></iframe></div>`;
  if(lesson.type==='text' || lesson.contentAr || lesson.contentEn) content += `<p style="color:var(--muted)">${currentLang==='ar'?(lesson.contentAr||''): (lesson.contentEn||'')}</p>`;
  if(lesson.type==='image' && lesson.resource) content += `<img src="${lesson.resource}" alt="lesson image">`;
  if(lesson.resource) content += `<p><a class="btn secondary" target="_blank" href="${lesson.resource}">${currentLang==='ar'?'تحميل/فتح المورد':'Open resource'}</a></p>`;
  content += `<button class="btn primary" onclick="markProgress('${course.id}', ${Math.round(((idx+1)/course.lessons.length)*100)})">${currentLang==='ar'?'تحديث التقدم':'Update progress'}</button>`;
  document.getElementById('lessonPlayer').innerHTML = content;
}
function markProgress(courseId,p){ localStorage.setItem(`progress_${courseId}`, p); renderCourses(); }

function selectPayTab(courseId, tab, btn){
  if(btn){ [...btn.parentElement.children].forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const course = courses.find(c=>c.id===courseId); if(!course) return;
  const panel = document.getElementById('payPanel');
  const t = i18n[currentLang];
  if(tab==='stripe') panel.innerHTML = `<a class="btn primary" target="_blank" href="${course.payment.stripePaymentLink}">${t.buy} • Stripe</a>`;
  if(tab==='paypal') panel.innerHTML = `<a class="btn primary" target="_blank" href="${course.payment.paypalCheckoutLink}">${t.buy} • PayPal</a>`;
  if(tab==='instapay') {
    const number = course.payment.instapayNumberOverride || siteData.payments.instapay.transferNumber;
    panel.innerHTML = `
      <div class="glass" style="padding:.8rem;margin-top:.6rem;">
        <p><b>InstaPay:</b> <span id="instaNum">${number}</span></p>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
          <button class="btn secondary" onclick="copyInstaNumber('${number}')">${t.copy}</button>
          <button class="btn primary" onclick="openInstaInstructions('${number}')">${t.buy}</button>
        </div>
        <small style="color:var(--muted)">${t.verifyNote}<br>${t.automateNote}</small>
      </div>
    `;
  }
}

    </div>

  `;

function exportSiteData(){
  siteData.courses = courses;
  const blob = new Blob([JSON.stringify(siteData,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'siteData-export.json';
  a.click();
}

function importSiteData(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const incoming = JSON.parse(r.result);
      if(incoming && typeof incoming === 'object'){
        siteData = { ...siteData, ...incoming };
        courses = Array.isArray(siteData.courses) ? siteData.courses : courses;
        persistSiteData();
      }
    } catch(_){}
  };
  r.readAsText(file);
}

function exportCourses(){
  const blob = new Blob([JSON.stringify(courses,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'courses-export.json';
  a.click();
}

function importCourses(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{ try { courses = JSON.parse(r.result); persistCourses(); } catch(_){} };
  r.readAsText(file);
}


function setupReveal(){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.reveal');
  if(reduced){ items.forEach(i=>i.classList.add('show')); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('show'); io.unobserve(e.target);} });
  }, {threshold:.15});
  items.forEach(i=>io.observe(i));
}
function setupCounters(){
  const nums = document.querySelectorAll('[data-counter]');
  nums.forEach(el=>{
    const target = Number(el.dataset.counter); let n=0;
    const step = Math.max(1,Math.round(target/30));
    const iv = setInterval(()=>{ n+=step; el.textContent = n>=target ? target : n; if(n>=target) clearInterval(iv); },40);
  });
}

function renderSchemas(){
  document.querySelectorAll('script[data-schema]').forEach(s=>s.remove());
  const person = {
    '@context':'https://schema.org','@type':'Person',name:siteData.profile.name,
    jobTitle: currentLang==='ar'?siteData.profile.titleAr:siteData.profile.titleEn,
    email:siteData.profile.email, telephone:siteData.profile.phone, sameAs:[siteData.profile.linkedIn]
  };
  const offerCatalog = {
    '@context':'https://schema.org','@type':'OfferCatalog',name:'Services',itemListElement:siteData.services.map(s=>({ '@type':'Offer', itemOffered:{'@type':'Service',name:currentLang==='ar'?s.titleAr:s.titleEn,description:currentLang==='ar'?s.descAr:s.descEn }}))
  };
  const courseSchemas = courses.map(c=>({ '@context':'https://schema.org','@type':'Course',name:currentLang==='ar'?c.titleAr:c.titleEn,description:currentLang==='ar'?c.descriptionAr:c.descriptionEn,provider:{'@type':'Person',name:siteData.profile.name}}));
  [person,offerCatalog,...courseSchemas].forEach(obj=>{
    const s = document.createElement('script'); s.type='application/ld+json'; s.dataset.schema='1'; s.textContent = JSON.stringify(obj); document.head.appendChild(s);
  });
}

document.getElementById('langToggle').addEventListener('click', ()=>applyLang(currentLang==='ar'?'en':'ar'));
document.getElementById('accentSwitch').addEventListener('change', e=>{ document.body.dataset.accent = e.target.value; localStorage.setItem('accent',e.target.value); });
document.getElementById('courseSearch').addEventListener('input', renderCourses);
document.getElementById('courseLanguageFilter').addEventListener('change', renderCourses);
document.getElementById('postSearch').addEventListener('input', renderPosts);
document.getElementById('postCategory').addEventListener('change', renderPosts);
document.getElementById('prevTestimonial').addEventListener('click', ()=>{ testimonialIndex = (testimonialIndex-1+siteData.testimonials.length)%siteData.testimonials.length; updateTestimonials();});
document.getElementById('nextTestimonial').addEventListener('click', ()=>{ testimonialIndex = (testimonialIndex+1)%siteData.testimonials.length; updateTestimonials();});
document.getElementById('contactForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const form = e.currentTarget;
  const payload = Object.fromEntries(new FormData(form));
  if(siteData.integrations.formspree.enabled && siteData.integrations.formspree.endpoint){
    fetch(siteData.integrations.formspree.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
  }
  window.location.href = `mailto:${siteData.profile.email}?subject=Consultation%20Request&body=${encodeURIComponent(payload.message||'')}`;
});
window.addEventListener('scroll', ()=>topNav.classList.toggle('scrolled', window.scrollY>24));
window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ ['courseModal','postModal','instaPayModal'].forEach(closeModal);} });

document.addEventListener('DOMContentLoaded', ()=>{
  const storedAccent = localStorage.getItem('accent') || 'blue';
  document.body.dataset.accent = storedAccent;
  document.getElementById('accentSwitch').value = storedAccent;
  const browser = navigator.language?.startsWith('ar') ? 'ar' : 'en';
  applyLang(localStorage.getItem('langPref') || browser || 'ar');
  initAdmin();
  setupReveal();
  setupCounters();
});
</script>
